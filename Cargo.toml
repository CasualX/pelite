[package]
name = "pelite"
version = "0.10.0"
authors = ["Casper <CasualX@users.noreply.github.com>"]
edition = "2024"
license = "MIT"

description = "Lightweight, memory-safe, zero-allocation library for reading and navigating PE binaries."
documentation = "https://docs.rs/pelite/"
repository = "https://github.com/CasualX/pelite"
readme = "readme.md"
keywords = ["exe", "dll", "mui", "bin", "pe"]
categories = ["parser-implementations", "command-line-utilities"]
exclude = ["tests/pocs/blob"]

[workspace]
members = [".", "./pelite-cli", "./wasm"]
resolver = "2"

[features]
default = ["mmap", "derive_pod"]
mmap = ["std", "dep:libc", "dep:windows-sys"]
unstable = []
derive_pod = ["dataview/derive_pod"]
basenc = ["dep:basenc"]
serde = ["dep:serde", "intptr/serde"]
std = []

[profile.release]
lto = true
opt-level = 2

[package.metadata.docs.rs]
all-features = true
default-target = "x86_64-pc-windows-msvc"

[dependencies]
dataview = { version = "1.0", default-features = false }
serde = { version = "1.0", optional = true, features = ["derive"] }
basenc = { version = "1.0.0-alpha.2", optional = true, default-features = false, features = ["alloc"] }
intptr = { version = "0.1.7", default-features = false, features = ["dataview_1"] }

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2.189", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = ">= 0.59.0, < 0.62", optional = true, features = ["Win32_Storage_FileSystem", "Win32_System_Memory", "Win32_Security"] }

[dev-dependencies]
lde = "0.3"
format_xml = "0.3"
serde_json = "1.0"
