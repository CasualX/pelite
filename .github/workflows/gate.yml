name: Gate

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux / Rust ${{ matrix.rust }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        rust:
          - "1.95"
          - stable
          - beta
          - nightly

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}

      - name: Check all targets and features
        run: cargo check --all-targets --all-features

      - name: Check library without default features
        run: cargo check --lib --no-default-features

      - name: Check no_std serialization support
        run: cargo check --lib --no-default-features --features serde,basenc

      - name: Run tests
        run: cargo test --all-features --no-fail-fast

  wasm:
    name: WebAssembly
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Build WebAssembly crate
        env:
          RUSTFLAGS: -C link-arg=--allow-undefined
        run: cargo build --package pelite-wasm --target wasm32-unknown-unknown

  windows:
    name: Windows / ${{ matrix.target }}
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-pc-windows-msvc
          - i686-pc-windows-msvc

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Check all targets and features
        run: cargo check --target ${{ matrix.target }} --all-targets --all-features

      - name: Run tests
        run: cargo test --target ${{ matrix.target }} --all-features --no-fail-fast
