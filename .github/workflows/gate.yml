name: Gate

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux / Rust ${{ matrix.rust }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        rust:
          - "1.95"
          - stable
          - beta
          - nightly

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}

      - name: Check all targets and features
        run: cargo check -p pelite -p binfact -p pelite-cli --all-targets --all-features

      - name: Check library without default features
        run: cargo check --lib --no-default-features

      - name: Check no_std serialization support
        run: cargo check --lib --no-default-features --features serde,basenc

      - name: Run tests
        run: cargo test -p pelite -p binfact -p pelite-cli --all-features --no-fail-fast

  pelite-js:
    name: WebAssembly
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pelite-js/package-lock.json

      - name: Build npm package
        working-directory: pelite-js
        run: |
          npm ci
          npm run build
          npm pack --dry-run --ignore-scripts

  windows:
    name: Windows / ${{ matrix.target }}
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-pc-windows-msvc
          - i686-pc-windows-msvc

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Check all targets and features
        run: cargo check -p pelite -p binfact -p pelite-cli --target ${{ matrix.target }} --all-targets --all-features

      - name: Run tests
        run: cargo test -p pelite -p binfact -p pelite-cli --target ${{ matrix.target }} --all-features --no-fail-fast
