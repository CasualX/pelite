<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>PeLite WASM Playground</title>
	<link rel="stylesheet" href="playground.css">
	<script type="module" src="playground.js"></script>
</head>
<body>
	<main>
		<h1>PeLite WASM Playground</h1>
		<p>Select a Windows executable or DLL, then choose what to inspect.</p>

		<section class="panel">
			<label for="sample">PE file</label>
			<input id="sample" type="file" accept=".exe,.dll,.sys,.ocx,application/vnd.microsoft.portable-executable" disabled>
			<p id="status" role="status">Loading PeLite…</p>
		</section>

		<form id="query" class="panel" hidden>
			<label for="operation">Operation</label>
			<select id="operation"></select>
			<div id="arguments" class="arguments"></div>
			<button type="submit">Run</button>
		</form>

		<section class="panel output-panel">
			<div class="output-heading">
				<h2>Result</h2>
				<button id="copy" type="button" disabled>Copy</button>
			</div>
			<pre id="output">Select a PE file to begin.</pre>
		</section>
	</main>
</body>
</html>
