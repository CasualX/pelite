[package]
name = "pelite-wasm"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies.pelite]
path = ".."
version = "0.10.0"
features = ["serde", "basenc"]

[dependencies]
binfact = { path = "../binfact" }
iced-x86 = { version = "1.21.0", default-features = false, features = ["decoder", "intel", "std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
md5 = "0.8.1"
sha2 = "0.11"
basenc = "1.0.0-alpha.2"
