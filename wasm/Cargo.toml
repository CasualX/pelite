[package]
name = "pelite-wasm"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies.pelite]
path = ".."
version = "0.10.0"
features = ["serde", "basenc"]

[dependencies]
iced-x86 = { version = "1.21.0", default-features = false, features = ["decoder", "intel", "std"] }
serde = "1.0"
serde_json = "1.0"
