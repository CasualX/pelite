[package]
name = "pelite-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"

license = "GPL-3.0-only"
authors = ["Casper <CasualX@users.noreply.github.com>"]
description = "Command-line tools for inspecting PE binaries with pelite"
categories = ["command-line-utilities"]

[dependencies]
basenc = "1.0.0-alpha.2"
binfact = { path = "../binfact" }
clap = "4.6.7"
dataview = { version = "1.1", default-features = false }
iced-x86 = { version = "1.21.0", default-features = false, features = ["decoder", "intel", "instr_info", "std"] }
md5 = "0.8.1"
msvc-demangler = "0.11"
pelite = { path = "..", features = ["basenc", "serde", "mmap"] }
regex-lite = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
sha2 = "0.11"
urandom = "1.0.0-alpha.3"
