[package]
name = "pelite-cli"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Command-line tools for inspecting PE binaries with pelite"

[dependencies]
clap = "4.6.7"
iced-x86 = { version = "1.21.0", default-features = false, features = ["decoder", "intel", "std"] }
md5 = "0.8.1"
pelite = { path = "..", features = ["basenc", "serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
urandom = "1.0.0-alpha.3"
